# Merge these providers and rules into your existing mihomo configuration.
rule-providers:
  compiled-social-block:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/social.mrs"
    path: "./rule_provider/compiled/social.mrs"
    interval: 86400
  compiled-social-block-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/social-regex.txt"
    path: "./rule_provider/compiled/social-regex.txt"
    interval: 86400
  compiled-social-allow:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/social-allow.mrs"
    path: "./rule_provider/compiled/social-allow.mrs"
    interval: 86400
  compiled-social-allow-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/social-allow-regex.txt"
    path: "./rule_provider/compiled/social-allow-regex.txt"
    interval: 86400
  compiled-social-block-important:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/social-block-important.mrs"
    path: "./rule_provider/compiled/social-block-important.mrs"
    interval: 86400
  compiled-social-block-important-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/social-block-important-regex.txt"
    path: "./rule_provider/compiled/social-block-important-regex.txt"
    interval: 86400
  compiled-social-allow-important:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/social-allow-important.mrs"
    path: "./rule_provider/compiled/social-allow-important.mrs"
    interval: 86400
  compiled-social-allow-important-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/social-allow-important-regex.txt"
    path: "./rule_provider/compiled/social-allow-important-regex.txt"
    interval: 86400
rules:
  - "AND,((OR,((RULE-SET,compiled-social-block-important),(RULE-SET,compiled-social-block-important-regex))),(NOT,((OR,((RULE-SET,compiled-social-allow-important),(RULE-SET,compiled-social-allow-important-regex)))))),REJECT"
  - "AND,((OR,((RULE-SET,compiled-social-block),(RULE-SET,compiled-social-block-regex))),(NOT,((OR,((RULE-SET,compiled-social-allow),(RULE-SET,compiled-social-allow-regex))))),(NOT,((OR,((RULE-SET,compiled-social-allow-important),(RULE-SET,compiled-social-allow-important-regex)))))),REJECT"
