{
  "rule-providers": {
    "compiled-game-console-block": {
      "type": "http",
      "behavior": "domain",
      "format": "mrs",
      "url": "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/game-console.mrs",
      "path": "./rule_provider/compiled/game-console.mrs",
      "interval": 86400
    },
    "compiled-game-console-block-regex": {
      "type": "http",
      "behavior": "classical",
      "format": "text",
      "url": "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/game-console-regex.txt",
      "path": "./rule_provider/compiled/game-console-regex.txt",
      "interval": 86400
    }
  },
  "rules": [
    "OR,((RULE-SET,compiled-game-console-block),(RULE-SET,compiled-game-console-block-regex)),REJECT"
  ]
}
