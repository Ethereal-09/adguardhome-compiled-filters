# Merge these providers and rules into your existing mihomo configuration.
rule-providers:
  compiled-phishing-block:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/phishing.mrs"
    path: "./rule_provider/compiled/phishing.mrs"
    interval: 86400
  compiled-phishing-block-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/phishing-regex.txt"
    path: "./rule_provider/compiled/phishing-regex.txt"
    interval: 86400
  compiled-phishing-allow:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/phishing-allow.mrs"
    path: "./rule_provider/compiled/phishing-allow.mrs"
    interval: 86400
  compiled-phishing-allow-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/phishing-allow-regex.txt"
    path: "./rule_provider/compiled/phishing-allow-regex.txt"
    interval: 86400
  compiled-phishing-block-important:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/phishing-block-important.mrs"
    path: "./rule_provider/compiled/phishing-block-important.mrs"
    interval: 86400
  compiled-phishing-block-important-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/phishing-block-important-regex.txt"
    path: "./rule_provider/compiled/phishing-block-important-regex.txt"
    interval: 86400
  compiled-phishing-allow-important:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/phishing-allow-important.mrs"
    path: "./rule_provider/compiled/phishing-allow-important.mrs"
    interval: 86400
  compiled-phishing-allow-important-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/phishing-allow-important-regex.txt"
    path: "./rule_provider/compiled/phishing-allow-important-regex.txt"
    interval: 86400
rules:
  - "AND,((OR,((RULE-SET,compiled-phishing-block-important),(RULE-SET,compiled-phishing-block-important-regex))),(NOT,((OR,((RULE-SET,compiled-phishing-allow-important),(RULE-SET,compiled-phishing-allow-important-regex)))))),REJECT"
  - "AND,((OR,((RULE-SET,compiled-phishing-block),(RULE-SET,compiled-phishing-block-regex))),(NOT,((OR,((RULE-SET,compiled-phishing-allow),(RULE-SET,compiled-phishing-allow-regex))))),(NOT,((OR,((RULE-SET,compiled-phishing-allow-important),(RULE-SET,compiled-phishing-allow-important-regex)))))),REJECT"
