# Merge these providers and rules into your existing mihomo configuration.
rule-providers:
  compiled-samsung-block:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/samsung.mrs"
    path: "./rule_provider/compiled/samsung.mrs"
    interval: 86400
  compiled-samsung-block-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/samsung-regex.txt"
    path: "./rule_provider/compiled/samsung-regex.txt"
    interval: 86400
  compiled-samsung-allow:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/samsung-allow.mrs"
    path: "./rule_provider/compiled/samsung-allow.mrs"
    interval: 86400
  compiled-samsung-allow-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/samsung-allow-regex.txt"
    path: "./rule_provider/compiled/samsung-allow-regex.txt"
    interval: 86400
  compiled-samsung-block-important:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/samsung-block-important.mrs"
    path: "./rule_provider/compiled/samsung-block-important.mrs"
    interval: 86400
  compiled-samsung-block-important-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/samsung-block-important-regex.txt"
    path: "./rule_provider/compiled/samsung-block-important-regex.txt"
    interval: 86400
  compiled-samsung-allow-important:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/samsung-allow-important.mrs"
    path: "./rule_provider/compiled/samsung-allow-important.mrs"
    interval: 86400
  compiled-samsung-allow-important-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/samsung-allow-important-regex.txt"
    path: "./rule_provider/compiled/samsung-allow-important-regex.txt"
    interval: 86400
rules:
  - "AND,((OR,((RULE-SET,compiled-samsung-block-important),(RULE-SET,compiled-samsung-block-important-regex))),(NOT,((OR,((RULE-SET,compiled-samsung-allow-important),(RULE-SET,compiled-samsung-allow-important-regex)))))),REJECT"
  - "AND,((OR,((RULE-SET,compiled-samsung-block),(RULE-SET,compiled-samsung-block-regex))),(NOT,((OR,((RULE-SET,compiled-samsung-allow),(RULE-SET,compiled-samsung-allow-regex))))),(NOT,((OR,((RULE-SET,compiled-samsung-allow-important),(RULE-SET,compiled-samsung-allow-important-regex)))))),REJECT"
