# Merge these providers and rules into your existing mihomo configuration.
rule-providers:
  compiled-aggressive-1hosts-block:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://github.boki.moe/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/aggressive-1hosts.mrs"
    path: "./rule_provider/compiled/aggressive-1hosts.mrs"
    interval: 86400
  compiled-aggressive-1hosts-block-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://github.boki.moe/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/aggressive-1hosts-regex.txt"
    path: "./rule_provider/compiled/aggressive-1hosts-regex.txt"
    interval: 86400
  compiled-aggressive-1hosts-allow:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://github.boki.moe/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/aggressive-1hosts-allow.mrs"
    path: "./rule_provider/compiled/aggressive-1hosts-allow.mrs"
    interval: 86400
  compiled-aggressive-1hosts-allow-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://github.boki.moe/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/aggressive-1hosts-allow-regex.txt"
    path: "./rule_provider/compiled/aggressive-1hosts-allow-regex.txt"
    interval: 86400
  compiled-aggressive-1hosts-block-important:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://github.boki.moe/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/aggressive-1hosts-block-important.mrs"
    path: "./rule_provider/compiled/aggressive-1hosts-block-important.mrs"
    interval: 86400
  compiled-aggressive-1hosts-block-important-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://github.boki.moe/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/aggressive-1hosts-block-important-regex.txt"
    path: "./rule_provider/compiled/aggressive-1hosts-block-important-regex.txt"
    interval: 86400
  compiled-aggressive-1hosts-allow-important:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://github.boki.moe/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/aggressive-1hosts-allow-important.mrs"
    path: "./rule_provider/compiled/aggressive-1hosts-allow-important.mrs"
    interval: 86400
  compiled-aggressive-1hosts-allow-important-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://github.boki.moe/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/aggressive-1hosts-allow-important-regex.txt"
    path: "./rule_provider/compiled/aggressive-1hosts-allow-important-regex.txt"
    interval: 86400
rules:
  - "AND,((OR,((RULE-SET,compiled-aggressive-1hosts-block-important),(RULE-SET,compiled-aggressive-1hosts-block-important-regex))),(NOT,((OR,((RULE-SET,compiled-aggressive-1hosts-allow-important),(RULE-SET,compiled-aggressive-1hosts-allow-important-regex)))))),REJECT"
  - "AND,((OR,((RULE-SET,compiled-aggressive-1hosts-block),(RULE-SET,compiled-aggressive-1hosts-block-regex))),(NOT,((OR,((RULE-SET,compiled-aggressive-1hosts-allow),(RULE-SET,compiled-aggressive-1hosts-allow-regex))))),(NOT,((OR,((RULE-SET,compiled-aggressive-1hosts-allow-important),(RULE-SET,compiled-aggressive-1hosts-allow-important-regex)))))),REJECT"
