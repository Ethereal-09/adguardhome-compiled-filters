  "rules": [
    "AND,((OR,((RULE-SET,pcdn-block-important-domain),(RULE-SET,pcdn-block-important-classical))),(NOT,((OR,((RULE-SET,pcdn-allow-important-domain),(RULE-SET,pcdn-allow-important-classical)))))),REJECT",
