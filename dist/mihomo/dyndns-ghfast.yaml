# Merge these providers and rules into your existing mihomo configuration.
rule-providers:
  compiled-dyndns-block:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/dyndns.mrs"
    path: "./rule_provider/compiled/dyndns.mrs"
    interval: 86400
  compiled-dyndns-block-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/dyndns-regex.txt"
    path: "./rule_provider/compiled/dyndns-regex.txt"
    interval: 86400
  compiled-dyndns-allow:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/dyndns-allow.mrs"
    path: "./rule_provider/compiled/dyndns-allow.mrs"
    interval: 86400
  compiled-dyndns-allow-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/dyndns-allow-regex.txt"
    path: "./rule_provider/compiled/dyndns-allow-regex.txt"
    interval: 86400
  compiled-dyndns-block-important:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/dyndns-block-important.mrs"
    path: "./rule_provider/compiled/dyndns-block-important.mrs"
    interval: 86400
  compiled-dyndns-block-important-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/dyndns-block-important-regex.txt"
    path: "./rule_provider/compiled/dyndns-block-important-regex.txt"
    interval: 86400
  compiled-dyndns-allow-important:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/dyndns-allow-important.mrs"
    path: "./rule_provider/compiled/dyndns-allow-important.mrs"
    interval: 86400
  compiled-dyndns-allow-important-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/dyndns-allow-important-regex.txt"
    path: "./rule_provider/compiled/dyndns-allow-important-regex.txt"
    interval: 86400
rules:
  - "AND,((OR,((RULE-SET,compiled-dyndns-block-important),(RULE-SET,compiled-dyndns-block-important-regex))),(NOT,((OR,((RULE-SET,compiled-dyndns-allow-important),(RULE-SET,compiled-dyndns-allow-important-regex)))))),REJECT"
  - "AND,((OR,((RULE-SET,compiled-dyndns-block),(RULE-SET,compiled-dyndns-block-regex))),(NOT,((OR,((RULE-SET,compiled-dyndns-allow),(RULE-SET,compiled-dyndns-allow-regex))))),(NOT,((OR,((RULE-SET,compiled-dyndns-allow-important),(RULE-SET,compiled-dyndns-allow-important-regex)))))),REJECT"
