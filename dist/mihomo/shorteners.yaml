# Merge these providers and rules into your existing mihomo configuration.
rule-providers:
  compiled-shorteners-block:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/shorteners.mrs"
    path: "./rule_provider/compiled/shorteners.mrs"
    interval: 86400
  compiled-shorteners-block-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/shorteners-regex.txt"
    path: "./rule_provider/compiled/shorteners-regex.txt"
    interval: 86400
  compiled-shorteners-allow:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/shorteners-allow.mrs"
    path: "./rule_provider/compiled/shorteners-allow.mrs"
    interval: 86400
  compiled-shorteners-allow-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/shorteners-allow-regex.txt"
    path: "./rule_provider/compiled/shorteners-allow-regex.txt"
    interval: 86400
  compiled-shorteners-block-important:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/shorteners-block-important.mrs"
    path: "./rule_provider/compiled/shorteners-block-important.mrs"
    interval: 86400
  compiled-shorteners-block-important-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/shorteners-block-important-regex.txt"
    path: "./rule_provider/compiled/shorteners-block-important-regex.txt"
    interval: 86400
  compiled-shorteners-allow-important:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/shorteners-allow-important.mrs"
    path: "./rule_provider/compiled/shorteners-allow-important.mrs"
    interval: 86400
  compiled-shorteners-allow-important-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/shorteners-allow-important-regex.txt"
    path: "./rule_provider/compiled/shorteners-allow-important-regex.txt"
    interval: 86400
rules:
  - "AND,((OR,((RULE-SET,compiled-shorteners-block-important),(RULE-SET,compiled-shorteners-block-important-regex))),(NOT,((OR,((RULE-SET,compiled-shorteners-allow-important),(RULE-SET,compiled-shorteners-allow-important-regex)))))),REJECT"
  - "AND,((OR,((RULE-SET,compiled-shorteners-block),(RULE-SET,compiled-shorteners-block-regex))),(NOT,((OR,((RULE-SET,compiled-shorteners-allow),(RULE-SET,compiled-shorteners-allow-regex))))),(NOT,((OR,((RULE-SET,compiled-shorteners-allow-important),(RULE-SET,compiled-shorteners-allow-important-regex)))))),REJECT"
