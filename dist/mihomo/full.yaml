{
  "rule-providers": {
    "full-block-domain": {
      "type": "http",
      "behavior": "domain",
      "format": "text",
      "interval": 86400,
      "url": "https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/full-block-domain.txt",
      "path": "./rule_provider/excel/full-block-domain.txt"
    },
    "full-block-classical": {
      "type": "http",
      "behavior": "classical",
      "format": "text",
      "interval": 86400,
      "url": "https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/full-block-classical.txt",
      "path": "./rule_provider/excel/full-block-classical.txt"
    },
    "full-allow-domain": {
      "type": "http",
      "behavior": "domain",
      "format": "text",
      "interval": 86400,
      "url": "https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/full-allow-domain.txt",
      "path": "./rule_provider/excel/full-allow-domain.txt"
    },
    "full-allow-classical": {
      "type": "http",
      "behavior": "classical",
      "format": "text",
      "interval": 86400,
      "url": "https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/full-allow-classical.txt",
      "path": "./rule_provider/excel/full-allow-classical.txt"
    },
    "full-block-important-domain": {
      "type": "http",
      "behavior": "domain",
      "format": "text",
      "interval": 86400,
      "url": "https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/full-block-important-domain.txt",
      "path": "./rule_provider/excel/full-block-important-domain.txt"
    },
    "full-block-important-classical": {
      "type": "http",
      "behavior": "classical",
      "format": "text",
      "interval": 86400,
      "url": "https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/full-block-important-classical.txt",
      "path": "./rule_provider/excel/full-block-important-classical.txt"
    },
    "full-allow-important-domain": {
      "type": "http",
      "behavior": "domain",
      "format": "text",
      "interval": 86400,
      "url": "https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/full-allow-important-domain.txt",
      "path": "./rule_provider/excel/full-allow-important-domain.txt"
    },
    "full-allow-important-classical": {
      "type": "http",
      "behavior": "classical",
      "format": "text",
      "interval": 86400,
      "url": "https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/full-allow-important-classical.txt",
      "path": "./rule_provider/excel/full-allow-important-classical.txt"
    }
  },
  "rules": [
    "AND,((OR,((RULE-SET,full-block-important-domain),(RULE-SET,full-block-important-classical))),(NOT,((OR,((RULE-SET,full-allow-important-domain),(RULE-SET,full-allow-important-classical)))))),REJECT",
    "AND,((OR,((RULE-SET,full-block-domain),(RULE-SET,full-block-classical))),(NOT,((OR,((RULE-SET,full-allow-important-domain),(RULE-SET,full-allow-important-classical))))),(NOT,((OR,((RULE-SET,full-allow-domain),(RULE-SET,full-allow-classical)))))),REJECT"
  ]
}
