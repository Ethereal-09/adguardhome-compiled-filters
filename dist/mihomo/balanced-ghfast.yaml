# Merge these providers and rules into your existing mihomo configuration.
rule-providers:
  compiled-balanced-block:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/balanced.mrs"
    path: "./rule_provider/compiled/balanced.mrs"
    interval: 86400
  compiled-balanced-block-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/balanced-regex.txt"
    path: "./rule_provider/compiled/balanced-regex.txt"
    interval: 86400
  compiled-balanced-allow:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/balanced-allow.mrs"
    path: "./rule_provider/compiled/balanced-allow.mrs"
    interval: 86400
  compiled-balanced-allow-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/balanced-allow-regex.txt"
    path: "./rule_provider/compiled/balanced-allow-regex.txt"
    interval: 86400
  compiled-balanced-block-important:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/balanced-block-important.mrs"
    path: "./rule_provider/compiled/balanced-block-important.mrs"
    interval: 86400
  compiled-balanced-block-important-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/balanced-block-important-regex.txt"
    path: "./rule_provider/compiled/balanced-block-important-regex.txt"
    interval: 86400
  compiled-balanced-allow-important:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/balanced-allow-important.mrs"
    path: "./rule_provider/compiled/balanced-allow-important.mrs"
    interval: 86400
  compiled-balanced-allow-important-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/balanced-allow-important-regex.txt"
    path: "./rule_provider/compiled/balanced-allow-important-regex.txt"
    interval: 86400
rules:
  - "AND,((OR,((RULE-SET,compiled-balanced-block-important),(RULE-SET,compiled-balanced-block-important-regex))),(NOT,((OR,((RULE-SET,compiled-balanced-allow-important),(RULE-SET,compiled-balanced-allow-important-regex)))))),REJECT"
  - "AND,((OR,((RULE-SET,compiled-balanced-block),(RULE-SET,compiled-balanced-block-regex))),(NOT,((OR,((RULE-SET,compiled-balanced-allow),(RULE-SET,compiled-balanced-allow-regex))))),(NOT,((OR,((RULE-SET,compiled-balanced-allow-important),(RULE-SET,compiled-balanced-allow-important-regex)))))),REJECT"
