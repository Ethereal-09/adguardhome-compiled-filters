# Merge these providers and rules into your existing mihomo configuration.
rule-providers:
  compiled-game-console-block:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/game-console.mrs"
    path: "./rule_provider/compiled/game-console.mrs"
    interval: 86400
  compiled-game-console-block-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/game-console-regex.txt"
    path: "./rule_provider/compiled/game-console-regex.txt"
    interval: 86400
  compiled-game-console-allow:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/game-console-allow.mrs"
    path: "./rule_provider/compiled/game-console-allow.mrs"
    interval: 86400
  compiled-game-console-allow-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/game-console-allow-regex.txt"
    path: "./rule_provider/compiled/game-console-allow-regex.txt"
    interval: 86400
  compiled-game-console-block-important:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/game-console-block-important.mrs"
    path: "./rule_provider/compiled/game-console-block-important.mrs"
    interval: 86400
  compiled-game-console-block-important-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/game-console-block-important-regex.txt"
    path: "./rule_provider/compiled/game-console-block-important-regex.txt"
    interval: 86400
  compiled-game-console-allow-important:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/game-console-allow-important.mrs"
    path: "./rule_provider/compiled/game-console-allow-important.mrs"
    interval: 86400
  compiled-game-console-allow-important-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/game-console-allow-important-regex.txt"
    path: "./rule_provider/compiled/game-console-allow-important-regex.txt"
    interval: 86400
rules:
  - "AND,((OR,((RULE-SET,compiled-game-console-block-important),(RULE-SET,compiled-game-console-block-important-regex))),(NOT,((OR,((RULE-SET,compiled-game-console-allow-important),(RULE-SET,compiled-game-console-allow-important-regex)))))),REJECT"
  - "AND,((OR,((RULE-SET,compiled-game-console-block),(RULE-SET,compiled-game-console-block-regex))),(NOT,((OR,((RULE-SET,compiled-game-console-allow),(RULE-SET,compiled-game-console-allow-regex))))),(NOT,((OR,((RULE-SET,compiled-game-console-allow-important),(RULE-SET,compiled-game-console-allow-important-regex)))))),REJECT"
