name: Compile Excel-selected rules

on:
  workflow_dispatch:
  schedule:
    - cron: '23 20 * * *'
  push:
    branches: [main]
    paths:
      - sources.xlsx
      - sources.json
      - compile_rules.py
      - compiler/**
      - tools/**
      - tests/**
      - licenses/**
      - .github/workflows/update.yml

permissions:
  contents: write

concurrency:
  group: excel-dns-compiler
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      DNS_RULE_VALIDATOR: ${{ github.workspace }}/.cache/dns-rule-validator
      MIHOMO_BINARY: ${{ github.workspace }}/.cache/mihomo/mihomo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: tools/engine/go.sum
      - name: Install and test pinned engines
        run: python tools/install_engines.py
      - name: Test compiler behavior with actual engines
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Restore verified source cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/excel-sources
          key: excel-sources-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: excel-sources-v2-
      - name: Compile, verify, and publish complete generation
        id: compile
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python compile_rules.py 2>&1 | tee .cache/build.log
      - name: Save verified source cache
        if: always() && steps.compile.outcome != 'skipped' && hashFiles('.cache/excel-sources/*.json') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/excel-sources
          key: excel-sources-v2-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Commit subscriptions and README build status
        if: always() && (steps.compile.outcome == 'success' || steps.compile.outcome == 'failure')
        shell: bash
        run: |
          git add README.md dist/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Compile Excel-selected subscriptions and update build statistics'
          git push
      - name: Save build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: excel-compiler-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/build-report.json
            .cache/build.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Signal failure or fallback after saving verified outputs
        if: always() && steps.compile.outcome == 'failure'
        run: exit 1
