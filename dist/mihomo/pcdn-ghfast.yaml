      "url": "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/pcdn-block-important-domain.txt",
      "path": "./rule_provider/excel/pcdn-block-important-domain.txt"
    },
    "pcdn-block-important-classical": {
      "type": "http",
      "behavior": "classical",
      "format": "text",
      "interval": 86400,
