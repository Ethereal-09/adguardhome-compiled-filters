# Merge these providers and rules into your existing mihomo configuration.
rule-providers:
  compiled-scam-block:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/scam.mrs"
    path: "./rule_provider/compiled/scam.mrs"
    interval: 86400
  compiled-scam-block-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/scam-regex.txt"
    path: "./rule_provider/compiled/scam-regex.txt"
    interval: 86400
  compiled-scam-allow:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/scam-allow.mrs"
    path: "./rule_provider/compiled/scam-allow.mrs"
    interval: 86400
  compiled-scam-allow-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/scam-allow-regex.txt"
    path: "./rule_provider/compiled/scam-allow-regex.txt"
    interval: 86400
  compiled-scam-block-important:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/scam-block-important.mrs"
    path: "./rule_provider/compiled/scam-block-important.mrs"
    interval: 86400
  compiled-scam-block-important-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/scam-block-important-regex.txt"
    path: "./rule_provider/compiled/scam-block-important-regex.txt"
    interval: 86400
  compiled-scam-allow-important:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/scam-allow-important.mrs"
    path: "./rule_provider/compiled/scam-allow-important.mrs"
    interval: 86400
  compiled-scam-allow-important-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/scam-allow-important-regex.txt"
    path: "./rule_provider/compiled/scam-allow-important-regex.txt"
    interval: 86400
rules:
  - "AND,((OR,((RULE-SET,compiled-scam-block-important),(RULE-SET,compiled-scam-block-important-regex))),(NOT,((OR,((RULE-SET,compiled-scam-allow-important),(RULE-SET,compiled-scam-allow-important-regex)))))),REJECT"
  - "AND,((OR,((RULE-SET,compiled-scam-block),(RULE-SET,compiled-scam-block-regex))),(NOT,((OR,((RULE-SET,compiled-scam-allow),(RULE-SET,compiled-scam-allow-regex))))),(NOT,((OR,((RULE-SET,compiled-scam-allow-important),(RULE-SET,compiled-scam-allow-important-regex)))))),REJECT"
