# Merge these providers and rules into your existing mihomo configuration.
rule-providers:
  compiled-china-block:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/china.mrs"
    path: "./rule_provider/compiled/china.mrs"
    interval: 86400
  compiled-china-block-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/china-regex.txt"
    path: "./rule_provider/compiled/china-regex.txt"
    interval: 86400
  compiled-china-allow:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/china-allow.mrs"
    path: "./rule_provider/compiled/china-allow.mrs"
    interval: 86400
  compiled-china-allow-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/china-allow-regex.txt"
    path: "./rule_provider/compiled/china-allow-regex.txt"
    interval: 86400
  compiled-china-block-important:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/china-block-important.mrs"
    path: "./rule_provider/compiled/china-block-important.mrs"
    interval: 86400
  compiled-china-block-important-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/china-block-important-regex.txt"
    path: "./rule_provider/compiled/china-block-important-regex.txt"
    interval: 86400
  compiled-china-allow-important:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/china-allow-important.mrs"
    path: "./rule_provider/compiled/china-allow-important.mrs"
    interval: 86400
  compiled-china-allow-important-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/china-allow-important-regex.txt"
    path: "./rule_provider/compiled/china-allow-important-regex.txt"
    interval: 86400
rules:
  - "AND,((OR,((RULE-SET,compiled-china-block-important),(RULE-SET,compiled-china-block-important-regex))),(NOT,((OR,((RULE-SET,compiled-china-allow-important),(RULE-SET,compiled-china-allow-important-regex)))))),REJECT"
  - "AND,((OR,((RULE-SET,compiled-china-block),(RULE-SET,compiled-china-block-regex))),(NOT,((OR,((RULE-SET,compiled-china-allow),(RULE-SET,compiled-china-allow-regex))))),(NOT,((OR,((RULE-SET,compiled-china-allow-important),(RULE-SET,compiled-china-allow-important-regex)))))),REJECT"
