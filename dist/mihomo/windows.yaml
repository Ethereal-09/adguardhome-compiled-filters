# Merge these providers and rules into your existing mihomo configuration.
rule-providers:
  compiled-windows-block:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/windows.mrs"
    path: "./rule_provider/compiled/windows.mrs"
    interval: 86400
  compiled-windows-block-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/windows-regex.txt"
    path: "./rule_provider/compiled/windows-regex.txt"
    interval: 86400
  compiled-windows-allow:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/windows-allow.mrs"
    path: "./rule_provider/compiled/windows-allow.mrs"
    interval: 86400
  compiled-windows-allow-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/windows-allow-regex.txt"
    path: "./rule_provider/compiled/windows-allow-regex.txt"
    interval: 86400
  compiled-windows-block-important:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/windows-block-important.mrs"
    path: "./rule_provider/compiled/windows-block-important.mrs"
    interval: 86400
  compiled-windows-block-important-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/windows-block-important-regex.txt"
    path: "./rule_provider/compiled/windows-block-important-regex.txt"
    interval: 86400
  compiled-windows-allow-important:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/windows-allow-important.mrs"
    path: "./rule_provider/compiled/windows-allow-important.mrs"
    interval: 86400
  compiled-windows-allow-important-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/windows-allow-important-regex.txt"
    path: "./rule_provider/compiled/windows-allow-important-regex.txt"
    interval: 86400
rules:
  - "AND,((OR,((RULE-SET,compiled-windows-block-important),(RULE-SET,compiled-windows-block-important-regex))),(NOT,((OR,((RULE-SET,compiled-windows-allow-important),(RULE-SET,compiled-windows-allow-important-regex)))))),REJECT"
  - "AND,((OR,((RULE-SET,compiled-windows-block),(RULE-SET,compiled-windows-block-regex))),(NOT,((OR,((RULE-SET,compiled-windows-allow),(RULE-SET,compiled-windows-allow-regex))))),(NOT,((OR,((RULE-SET,compiled-windows-allow-important),(RULE-SET,compiled-windows-allow-important-regex)))))),REJECT"
