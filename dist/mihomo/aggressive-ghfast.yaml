# Merge these providers and rules into your existing mihomo configuration.
rule-providers:
  compiled-aggressive-block:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/aggressive.mrs"
    path: "./rule_provider/compiled/aggressive.mrs"
    interval: 86400
  compiled-aggressive-block-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/aggressive-regex.txt"
    path: "./rule_provider/compiled/aggressive-regex.txt"
    interval: 86400
  compiled-aggressive-allow:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/aggressive-allow.mrs"
    path: "./rule_provider/compiled/aggressive-allow.mrs"
    interval: 86400
  compiled-aggressive-allow-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/aggressive-allow-regex.txt"
    path: "./rule_provider/compiled/aggressive-allow-regex.txt"
    interval: 86400
  compiled-aggressive-block-important:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/aggressive-block-important.mrs"
    path: "./rule_provider/compiled/aggressive-block-important.mrs"
    interval: 86400
  compiled-aggressive-block-important-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/aggressive-block-important-regex.txt"
    path: "./rule_provider/compiled/aggressive-block-important-regex.txt"
    interval: 86400
  compiled-aggressive-allow-important:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/aggressive-allow-important.mrs"
    path: "./rule_provider/compiled/aggressive-allow-important.mrs"
    interval: 86400
  compiled-aggressive-allow-important-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/aggressive-allow-important-regex.txt"
    path: "./rule_provider/compiled/aggressive-allow-important-regex.txt"
    interval: 86400
rules:
  - "AND,((OR,((RULE-SET,compiled-aggressive-block-important),(RULE-SET,compiled-aggressive-block-important-regex))),(NOT,((OR,((RULE-SET,compiled-aggressive-allow-important),(RULE-SET,compiled-aggressive-allow-important-regex)))))),REJECT"
  - "AND,((OR,((RULE-SET,compiled-aggressive-block),(RULE-SET,compiled-aggressive-block-regex))),(NOT,((OR,((RULE-SET,compiled-aggressive-allow),(RULE-SET,compiled-aggressive-allow-regex))))),(NOT,((OR,((RULE-SET,compiled-aggressive-allow-important),(RULE-SET,compiled-aggressive-allow-important-regex)))))),REJECT"
