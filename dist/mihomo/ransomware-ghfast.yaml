# Merge these providers and rules into your existing mihomo configuration.
rule-providers:
  compiled-ransomware-block:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/ransomware.mrs"
    path: "./rule_provider/compiled/ransomware.mrs"
    interval: 86400
  compiled-ransomware-block-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/ransomware-regex.txt"
    path: "./rule_provider/compiled/ransomware-regex.txt"
    interval: 86400
  compiled-ransomware-allow:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/ransomware-allow.mrs"
    path: "./rule_provider/compiled/ransomware-allow.mrs"
    interval: 86400
  compiled-ransomware-allow-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/ransomware-allow-regex.txt"
    path: "./rule_provider/compiled/ransomware-allow-regex.txt"
    interval: 86400
  compiled-ransomware-block-important:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/ransomware-block-important.mrs"
    path: "./rule_provider/compiled/ransomware-block-important.mrs"
    interval: 86400
  compiled-ransomware-block-important-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/ransomware-block-important-regex.txt"
    path: "./rule_provider/compiled/ransomware-block-important-regex.txt"
    interval: 86400
  compiled-ransomware-allow-important:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/ransomware-allow-important.mrs"
    path: "./rule_provider/compiled/ransomware-allow-important.mrs"
    interval: 86400
  compiled-ransomware-allow-important-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://ghfast.top/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/ransomware-allow-important-regex.txt"
    path: "./rule_provider/compiled/ransomware-allow-important-regex.txt"
    interval: 86400
rules:
  - "AND,((OR,((RULE-SET,compiled-ransomware-block-important),(RULE-SET,compiled-ransomware-block-important-regex))),(NOT,((OR,((RULE-SET,compiled-ransomware-allow-important),(RULE-SET,compiled-ransomware-allow-important-regex)))))),REJECT"
  - "AND,((OR,((RULE-SET,compiled-ransomware-block),(RULE-SET,compiled-ransomware-block-regex))),(NOT,((OR,((RULE-SET,compiled-ransomware-allow),(RULE-SET,compiled-ransomware-allow-regex))))),(NOT,((OR,((RULE-SET,compiled-ransomware-allow-important),(RULE-SET,compiled-ransomware-allow-important-regex)))))),REJECT"
