# Merge these providers and rules into your existing mihomo configuration.
rule-providers:
  compiled-full-block:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://github.boki.moe/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/full.mrs"
    path: "./rule_provider/compiled/full.mrs"
    interval: 86400
  compiled-full-block-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://github.boki.moe/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/full-regex.txt"
    path: "./rule_provider/compiled/full-regex.txt"
    interval: 86400
  compiled-full-allow:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://github.boki.moe/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/full-allow.mrs"
    path: "./rule_provider/compiled/full-allow.mrs"
    interval: 86400
  compiled-full-allow-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://github.boki.moe/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/full-allow-regex.txt"
    path: "./rule_provider/compiled/full-allow-regex.txt"
    interval: 86400
  compiled-full-block-important:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://github.boki.moe/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/full-block-important.mrs"
    path: "./rule_provider/compiled/full-block-important.mrs"
    interval: 86400
  compiled-full-block-important-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://github.boki.moe/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/full-block-important-regex.txt"
    path: "./rule_provider/compiled/full-block-important-regex.txt"
    interval: 86400
  compiled-full-allow-important:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://github.boki.moe/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/full-allow-important.mrs"
    path: "./rule_provider/compiled/full-allow-important.mrs"
    interval: 86400
  compiled-full-allow-important-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://github.boki.moe/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/full-allow-important-regex.txt"
    path: "./rule_provider/compiled/full-allow-important-regex.txt"
    interval: 86400
rules:
  - "AND,((OR,((RULE-SET,compiled-full-block-important),(RULE-SET,compiled-full-block-important-regex))),(NOT,((OR,((RULE-SET,compiled-full-allow-important),(RULE-SET,compiled-full-allow-important-regex)))))),REJECT"
  - "AND,((OR,((RULE-SET,compiled-full-block),(RULE-SET,compiled-full-block-regex))),(NOT,((OR,((RULE-SET,compiled-full-allow),(RULE-SET,compiled-full-allow-regex))))),(NOT,((OR,((RULE-SET,compiled-full-allow-important),(RULE-SET,compiled-full-allow-important-regex)))))),REJECT"
