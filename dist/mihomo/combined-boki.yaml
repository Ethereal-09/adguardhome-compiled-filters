# Merge these providers and rules into your existing mihomo configuration.
rule-providers:
  compiled-combined-block:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://github.boki.moe/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/combined.mrs"
    path: "./rule_provider/compiled/combined.mrs"
    interval: 86400
  compiled-combined-block-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://github.boki.moe/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/combined-regex.txt"
    path: "./rule_provider/compiled/combined-regex.txt"
    interval: 86400
  compiled-combined-allow:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://github.boki.moe/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/combined-allow.mrs"
    path: "./rule_provider/compiled/combined-allow.mrs"
    interval: 86400
  compiled-combined-allow-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://github.boki.moe/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/combined-allow-regex.txt"
    path: "./rule_provider/compiled/combined-allow-regex.txt"
    interval: 86400
  compiled-combined-block-important:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://github.boki.moe/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/combined-block-important.mrs"
    path: "./rule_provider/compiled/combined-block-important.mrs"
    interval: 86400
  compiled-combined-block-important-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://github.boki.moe/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/combined-block-important-regex.txt"
    path: "./rule_provider/compiled/combined-block-important-regex.txt"
    interval: 86400
  compiled-combined-allow-important:
    type: "http"
    behavior: "domain"
    format: "mrs"
    url: "https://github.boki.moe/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/combined-allow-important.mrs"
    path: "./rule_provider/compiled/combined-allow-important.mrs"
    interval: 86400
  compiled-combined-allow-important-regex:
    type: "http"
    behavior: "classical"
    format: "text"
    url: "https://github.boki.moe/https://raw.githubusercontent.com/Ethereal-09/adguardhome-compiled-filters/main/dist/mihomo/combined-allow-important-regex.txt"
    path: "./rule_provider/compiled/combined-allow-important-regex.txt"
    interval: 86400
rules:
  - "AND,((OR,((RULE-SET,compiled-combined-block-important),(RULE-SET,compiled-combined-block-important-regex))),(NOT,((OR,((RULE-SET,compiled-combined-allow-important),(RULE-SET,compiled-combined-allow-important-regex)))))),REJECT"
  - "AND,((OR,((RULE-SET,compiled-combined-block),(RULE-SET,compiled-combined-block-regex))),(NOT,((OR,((RULE-SET,compiled-combined-allow),(RULE-SET,compiled-combined-allow-regex))))),(NOT,((OR,((RULE-SET,compiled-combined-allow-important),(RULE-SET,compiled-combined-allow-important-regex)))))),REJECT"
